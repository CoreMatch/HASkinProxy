# HASkinProxy 部署声明（deploy-manifest v1）
# schema 依据：HA-Services-Deployer internal/manifest/（SchemaVersion=1）
manifest_version: 1
kind: service
project: haskinproxy
display_name: HASkinProxy
group: satellite
# 未知：仓库无版本 tag（仅 archive tag），代码与配置均无服务版本字段。
service_version: "unknown"

facts:
  ports:
    # deploy/config/haskinproxy.yaml.tmpl: server.listen_addr ":2702"；
    # compose 默认对外映射
    - name: http
      port: 2702
      exposure: public
  health:
    # internal/router/router.go r.GET("/health")；compose healthcheck 同路径
    http:
      port_name: http
      path: /health
      expect_status: 200
      timeout_seconds: 5
      interval_seconds: 30
      retries: 3
  smoke:
    # 部署后冒烟：走 Yggdrasil 兼容的 CSL 路径（GET /:username）取一次
    # profile。用一个必然不存在的用户名：代理真实触达上游并正确返回
    # 404 "user not found"（internal/handler/csl_handler.go；错误文案来自
    # internal/hrpauth/client.go "user not found"）。上游不可达时错误文案
    # 不同，断言会如实失败——证明的是查询链路活着，不是进程活着。
    - name: csl-profile-query-miss
      method: GET
      # CSL 路由是 /{username}.json（internal/router/router.go、
      # csl_handler.go GetProfile 对非 .json 后缀直接裸 404 空体）；
      # 带后缀才会真实走上游查询并回 {"error":"user not found"}。
      path: /ha_smoke_probe_zz9999.json
      expect_status: 404
      timeout_seconds: 10
      assert:
        contains: user not found
  depends_on:
    # upstream.base_url 指向 HRPAuth；启动期凭据自助换取（经 HRPAuth
    # /oauth/register），compose depends_on hrpauth: service_healthy。
    # 无数据库、无 redis（模板无对应段，缓存为内存缓存）。
    - project: hrpauth
      kind: required
  migration:
    # 无数据库；配置文件本身无版本字段（代码亦无 ConfigVersion 常量），
    # 不存在迁移机制。
    mode: none
  data_dirs: []
  config:
    # main.go configFileName="config.yaml"。
    # 模板版本未知：模板无 version 字段，代码无配置版本常量
    # （PROD-FILEREFRESH-20261107 §3-4 亦记录 "hasp 无版本字段"）。
    - path: config.yaml
      template_version: "unknown"
  static_assets: ""

baremetal:
  process:
    manager: aapanel
  install:
    # PROD-FILEREFRESH-20261107 §1：二进制在位路径 /www/wwwroot/hasp/hasp
    root: /www/wwwroot/hasp
    binary_name: hasp
  artifact:
    source: local_path
    local_path: build/hasp

container:
  enabled: false
  # 容器形态镜像：已真实发布（Docker Hub，build → push → 回拉 → 挂回
  # compose 平台冒烟全过，含 /:username.json 与 /textures/* 真实调用）。
  # 镜像为 linux/amd64 + linux/arm64 多架构 manifest list，digest 钉的是
  # manifest list 摘要（非单平台子摘要），为生效引用，tag 仅可读别名。
  # 部署时 Deployer 按 digest 优先真实拉取本镜像（鉴权沿用宿主 docker 登录态；拉后摘要对照不符即响亮失败）。
  image:
    source: registry
    repo: limeight/ha-haskinproxy
    tag: "5daa8c3"
    digest: "sha256:c086ffaf549c34482fa70a5b90067e39df0f92fd872610ffe60ae5419685a6b2"
